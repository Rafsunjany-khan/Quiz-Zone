{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Quiz Zone{% endblock %}</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold nav-accent" href="{% if user.is_authenticated %}{% url 'quiz:home' %}{% else %}{% url 'quiz:index' %}{% endif %}">
            <img src="{% static 'images/logo.png' %}" alt="Quiz Zone" height="40">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav" id="navbar-items">
                <!-- Navbar items injected by JS -->
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="bg-dark text-light mt-auto py-5">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-4 text-md-start text-center mb-3 mb-md-0">
                <h5 class="fw-bold">Quiz Zone</h5>
            </div>
            <div class="col-md-4 d-flex flex-column align-items-center text-center mb-3 mb-md-0">
                <div class="mb-2">
                    <a href="#" class="text-light mx-2 fs-5"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="text-light mx-2 fs-5"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="text-light mx-2 fs-5"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="text-light mx-2 fs-5"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#" class="text-light mx-2 fs-5"><i class="fab fa-youtube"></i></a>
                </div>
                <small>&copy; 2025 Quiz Zone. All rights reserved.</small>
            </div>
            <div class="col-md-4 text-md-end text-center d-flex flex-column align-items-md-end align-items-center">
                <p class="mb-1">+880 1701 983377</p>
                <p class="mb-0"><a href="mailto:info@quizzone.com" class="text-light">info@quizzone.com</a></p>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Navbar JS for dynamic login/logout -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const navbar = document.getElementById('navbar-items');
    const userIsAuthenticated = {{ user.is_authenticated|yesno:"true,false" }};
    const userIsActive = {{ user.is_active|yesno:"true,false" }};

    if(userIsAuthenticated && userIsActive) {
        // Post-login navbar
        navbar.innerHTML = `
            <li class="nav-item"><a class="nav-link ${window.location.pathname == '/home/' ? 'active' : ''}" href="{% url 'quiz:home' %}">Home</a></li>
            <li class="nav-item"><a class="nav-link ${window.location.pathname == '/about/' ? 'active' : ''}" href="{% url 'quiz:about' %}">About Us</a></li>
            <li class="nav-item"><a class="nav-link ${window.location.pathname == '/guideline/' ? 'active' : ''}" href="{% url 'quiz:guideline' %}">Guide Line</a></li>
            <li class="nav-item"><a class="nav-link ${window.location.pathname == '/notification/' ? 'active' : ''}" href="{% url 'quiz:notification' %}">Notification</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="{% url 'logout' %}">Logout</a></li>
        `;
    } else {
        // Pre-login / unverified navbar
        navbar.innerHTML = `
            <li class="nav-item"><a class="nav-link ${window.location.pathname == '/about/' ? 'active' : ''}" href="{% url 'quiz:about' %}">About Us</a></li>
            <li class="nav-item"><a class="nav-link ${window.location.pathname == '/guideline/' ? 'active' : ''}" href="{% url 'quiz:guideline' %}">Guide Line</a></li>
            <li class="nav-item"><a class="nav-link ${window.location.pathname == '/login/' ? 'active' : ''}" href="{% url 'login' %}">Login</a></li>
        `;
    }
});
</script>

</body>
</html>
