{% extends "base.html" %}
{% block title %}Home | Quiz Zone{% endblock %}

{% block content %}

<!-- Dashboard / Categories -->
<div class="container my-5">
    <h2 class="mb-3">Select a category to explore quizzes</h2>
    <div class="row">
        {% for category in categories %}
            <div class="col-md-4">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ category.name }}</h5>
                        <a href="{% url 'quiz_list' category.id %}" class="btn btn-primary mt-2">View Quizzes</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>No categories available.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
