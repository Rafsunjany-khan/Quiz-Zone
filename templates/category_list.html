{% extends "base.html" %}
{% block title %}Select Category | Quiz Zone{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="text-center my-4">Select Category</h2>
    <div class="row">
        {% for category in categories %}
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center d-flex flex-column justify-content-between">
                        <h5 class="card-title">{{ category.name }}</h5>
                        <a href="{% url 'quiz_list' category.id %}" class="btn btn-primary mt-3">View Quizzes</a>
                    </div>
                </div>
            </div>
        {% empty %}
            <p class="text-center fw-bold mt-4">No categories available.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
